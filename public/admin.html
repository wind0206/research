<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问卷后台统计</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; background: #f4f7fb; color: #1f2937; }
    .container { max-width: 1200px; margin: 32px auto; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    h1 { margin: 0; color: #1f3d7a; }
    .btn { text-decoration: none; display: inline-block; background: #4f7cff; color: white; padding: 10px 18px; border-radius: 10px; font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 6px 18px rgba(25,42,75,0.08); padding: 20px; border: 1px solid #ebf0ff; }
    .card h3 { margin: 0 0 10px; font-size: 0.9rem; color: #65748b; }
    .card .value { font-size: 2rem; font-weight: 700; color: #233b73; }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 6px 18px rgba(25,42,75,0.08); }
    th, td { border-bottom: 1px solid #edf1f7; padding: 12px 10px; text-align: left; vertical-align: top; word-break: break-word; }
    th { background: #eef4ff; color: #2d4e87; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>调查问卷后台</h1>
      <a class="btn" href="/">返回问卷页</a>
    </div>

    <div class="stats">
      <div class="card">
        <h3>总提交人数</h3>
        <div id="totalCount" class="value">0</div>
      </div>
      <div class="card">
        <h3>部门统计</h3>
        <div id="departmentList">正在加载...</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th><th>姓名</th><th>部门</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Q5</th><th>Q6</th><th>Q7</th><th>Q8</th><th>Q9</th><th>Q10</th><th>提交时间</th>
        </tr>
      </thead>
      <tbody id="answerBody"></tbody>
    </table>
  </div>

  <script>
    async function loadData() {
      const [statsRes, answersRes] = await Promise.all([
        fetch('/api/stats'),
        fetch('/api/answers')
      ]);
      const stats = await statsRes.json();
      const answers = await answersRes.json();

      document.getElementById('totalCount').textContent = stats.total ?? 0;

      const departmentList = document.getElementById('departmentList');
      departmentList.innerHTML = (stats.departments || []).length
        ? (stats.departments || []).map((d) => `<div>${d.department || '未填写'}：${d.total} 人</div>`).join('')
        : '暂无数据';

      const tbody = document.getElementById('answerBody');
      tbody.innerHTML = (answers || []).length
        ? (answers || []).map((row) => `
          <tr>
            <td>${row.id}</td>
            <td>${row.name || '-'}</td>
            <td>${row.department || '-'}</td>
            <td>${row.q1 || '-'}</td>
            <td>${row.q2 || '-'}</td>
            <td>${row.q3 || '-'}</td>
            <td>${row.q4 || '-'}</td>
            <td>${row.q5 || '-'}</td>
            <td>${row.q6 || '-'}</td>
            <td>${row.q7 || '-'}</td>
            <td>${row.q8 || '-'}</td>
            <td>${row.q9 || '-'}</td>
            <td>${row.q10 || '-'}</td>
            <td>${row.created_at || '-'}</td>
          </tr>
        `).join('')
        : '<tr><td colspan="14">暂无提交记录</td></tr>';
    }

    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
