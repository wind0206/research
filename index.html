<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>调查问卷</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #eef6ff 0%, #f9f3ff 100%);
      color: #222;
    }
    .container { max-width: 900px; margin: 40px auto; padding: 24px; }
    .survey-box {
      background: rgba(255,255,255,0.92);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(51, 74, 123, 0.12);
      padding: 32px 28px;
      border: 1px solid #e5e7eb;
    }
    h1 { text-align: center; color: #1f3d7a; margin: 0 0 10px; font-size: 2.2rem; }
    .subtitle { text-align: center; color: #5f6f8b; margin-bottom: 28px; font-size: 1rem; }
    .info-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 28px; }
    .field { display: flex; flex-direction: column; }
    .field label { margin-bottom: 8px; font-weight: 600; color: #2d3e5f; }
    .field input, .field textarea {
      width: 100%; border: 1px solid #d8dfef; border-radius: 12px; padding: 12px 14px; font-size: 1rem; background: #fff;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: #7aa6ff; box-shadow: 0 0 0 4px rgba(122,166,255,0.12); }
    .question-list { display: grid; gap: 22px; }
    .question { background: #f9fbff; border: 1px solid #e6ecff; border-radius: 16px; padding: 18px; }
    .question h3 { margin: 0 0 12px; font-size: 1.08rem; color: #2a3d66; }
    .question textarea { min-height: 90px; resize: vertical; }
    .actions { display: flex; justify-content: center; margin-top: 28px; gap: 14px; flex-wrap: wrap; }
    button { border: none; border-radius: 12px; padding: 12px 24px; font-size: 1rem; cursor: pointer; }
    .submit-btn { background: linear-gradient(135deg, #5a8cff, #7a6cff); color: white; box-shadow: 0 8px 18px rgba(90,140,255,0.28); }
    .reset-btn { background: #eef2ff; color: #374a8a; }
    .admin-link { text-align: center; margin-top: 18px; }
    .admin-link a { color: #3559d9; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="survey-box">
      <h1>调查问卷</h1>
      <div class="subtitle">感谢您参与本次调查，以下问题请根据实际情况填写。</div>

      <form id="surveyForm">
        <div class="info-row">
          <div class="field">
            <label for="name">姓名</label>
            <input id="name" name="name" type="text" placeholder="请输入您的姓名" required />
          </div>
          <div class="field">
            <label for="department">单位/部门</label>
            <input id="department" name="department" type="text" placeholder="请输入您的单位或部门" required />
          </div>
        </div>

        <div class="question-list">
          <div class="question"><h3>问题 1</h3><textarea name="q1" placeholder="请在此填写您的回答..." required></textarea></div>
          <div class="question"><h3>问题 2</h3><textarea name="q2" placeholder="请在此填写您的回答..." required></textarea></div>
          <div class="question"><h3>问题 3</h3><textarea name="q3" placeholder="请在此填写您的回答..." required></textarea></div>
          <div class="question"><h3>问题 4</h3><textarea name="q4" placeholder="请在此填写您的回答..." required></textarea></div>
          <div class="question"><h3>问题 5</h3><textarea name="q5" placeholder="请在此填写您的回答..." required></textarea></div>
          <div class="question"><h3>问题 6</h3><textarea name="q6" placeholder="请在此填写您的回答..." required></textarea></div>
          <div class="question"><h3>问题 7</h3><textarea name="q7" placeholder="请在此填写您的回答..." required></textarea></div>
          <div class="question"><h3>问题 8</h3><textarea name="q8" placeholder="请在此填写您的回答..." required></textarea></div>
          <div class="question"><h3>问题 9</h3><textarea name="q9" placeholder="请在此填写您的回答..." required></textarea></div>
          <div class="question"><h3>问题 10</h3><textarea name="q10" placeholder="请在此填写您的回答..." required></textarea></div>
        </div>

        <div class="actions">
          <button type="submit" class="submit-btn">提交问卷</button>
          <button type="reset" class="reset-btn">清空内容</button>
        </div>
      </form>

      <div class="admin-link"><a href="admin.html">查看后台统计</a></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('surveyForm');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());

      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const result = await res.json();
      alert(result.message || '提交完成');
      if (result.success) form.reset();
    });
  </script>
</body>
</html>
